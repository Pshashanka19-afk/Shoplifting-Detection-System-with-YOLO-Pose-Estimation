<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Security System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Register Account</h2>
        <form id="signupForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="new-password">
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div class="links">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
        <p id="message" style="display: none; margin-top: 15px; font-weight: 500;"></p>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgEl = document.getElementById('message');

            try {
                const res = await fetch('http://localhost:8000/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    msgEl.style.color = 'var(--accent)';
                    msgEl.textContent = 'Registration successful! Redirecting...';
                    msgEl.style.display = 'block';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    msgEl.style.color = 'var(--alert)';
                    msgEl.textContent = data.detail || 'Registration failed';
                    msgEl.style.display = 'block';
                }
            } catch (err) {
                msgEl.style.color = 'var(--alert)';
                msgEl.textContent = 'Connection error. Is the backend running?';
                msgEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
